services:
  jekyll:
    build:
      context: .
      # Hash of the image inputs (set by the Makefile). `make` compares it with
      # the existing image and only rebuilds when an input really changed.
      labels:
        org.arc42.image-inputs: ${IMAGE_INPUTS_HASH:-unset}
    # Own tag: arc42.org-site has a different Gemfile.lock and must not
    # overwrite this image (and vice versa).
    image: arc42-de-site:latest
    init: true
    environment:
      JEKYLL_ENV: development
      POLLING: "--force_polling"
    volumes:
      - .:/site
      - jekyll_cache:/site/.jekyll-cache
      - sass_cache:/site/.sass-cache
    ports:
      - '4201:4201'
    # No --incremental: full rebuild on change (~2.5s). Incremental silently
    # leaves stale/relocated output when permalinks or front matter change.
    command: >
      sh -c "bundle exec jekyll serve --host 0.0.0.0 --port 4201 --watch $${POLLING}"

volumes:
  jekyll_cache:
  sass_cache:
