# ---------------------------------------------------------------------------
# arc42.de navigation — 2026-08-05 layout
#
#   main    -> the priority row in the masthead. THREE items. The order is the
#              story the bar tells: Übersicht (was ist das) -> Schulungen (was
#              wir lehren) -> Termine (wann). `cta_mobile: true` marks the one
#              that takes the CTA slot on phones.
#   cta     -> the single flagged action in the band. Anmeldung: arc42.de owns
#              the registration flows in the family split, and it appeared in
#              the navigation zero times before this.
#   drawer  -> the "Mehr" menu. Each entry NAMES an existing group below rather
#              than repeating its links, so the masthead drawer and the sidebar
#              rails cannot drift apart.
#
# The groups `publications`, `schulungen`, `methode` and `about` are consumed
# BOTH by the drawer (_includes/masthead.html) and by the sidebar rails
# (_includes/sidebar.html -> _includes/nav_list) on the 17 pages that set
# `sidebar: nav:` in their front matter. Do not rename them without grepping
# _pages/ first.
#
# What left the masthead in this layout, and why:
#   "Mehr..."  -> became the drawer itself. A label that said nothing, sitting
#                 in the best position in the bar.
#   "Über..."  -> drawer + footer. Not a first-visit destination; arc42.org
#                 makes the same call.
#   "Download" -> drawer, marked external. It leads to arc42.org, and per the
#                 federation decision cross-site links belong in content, not
#                 in chrome. The EN/DE switch is the one sanctioned exception,
#                 because it routes to the same content in another language.
#   "Suche"    -> a real control in the band with a "/" hotkey, instead of a
#                 link that was first to vanish into the overflow menu.
# ---------------------------------------------------------------------------

# priority row (order matters)
main:
  - title: "Übersicht"
    url: /overview/
  - title: "Schulungen"
    url: /schulungen/
  - title: "Termine"
    url: /termine/
    cta_mobile: true

# the one flagged action in the band
cta:
  title: "Anmeldung"
  url: /anmeldung/

# "Mehr" drawer — references the groups below, never duplicates them
drawer:
  - group: schulungen
  - group: publications
  - group: methode
  - group: about

# Bücher / Artikel / Videos / Vorträge used to be four separate pages; they
# are now ONE filterable listing at /publikationen/, and the old URLs are
# redirect stubs. The children below are ?type= deep links into that listing
# (documented in CLAUDE.md), NOT the old pages — do not "fix" them into page
# URLs. Before 2026-08-12 this group was a bare linked heading, which rendered
# in the drawer as an empty column that read as a bug.
publications:
  - title: Publikationen
    url: /publikationen/
    children:
    - title: Alle Publikationen
      url: /publikationen/
    - title: Bücher
      url: /publikationen/?type=book
    - title: Artikel
      url: /publikationen/?type=article
    - title: Vorträge
      url: /publikationen/?type=talk
    - title: Videos
      url: /publikationen/?type=video

schulungen:
  - title: Schulungsangebot
    url: /schulungen/
    children:
    # 2026-08-13: "iSAQB Foundation" used to be a second entry pointing at the
    # same /info-msa/ — two labels, one destination, so visitors counted five
    # courses and found four. Merged into one label; if the Foundation course
    # ever gets its own page, split it out again.
    - title: Mastering Software Architectures (iSAQB Foundation)
      url: /info-msa/
      hint: "das Kernprogramm"
    - title: IMPROVE
      url: /info-improve/
    - title: REQ4ARC
      url: /info-req4arc/
    - title: ADOC
      url: /info-adoc/
    # "Unsere AGB" (/terms/) and "Bildergalerie" (/gallery/) were removed here
    # 2026-08-12: both duplicated entries in the `about` group under a second
    # label, showing twice in the drawer. /terms/ stays linked from the footer,
    # the Anmeldung commitment block, and Über uns; /gallery/ stays as
    # "Stimmung beim Training..." under Über uns. Cost: the course-page
    # sidebars (this group's second consumer) no longer carry the two links.

# New group. Collects pages that were reachable only from the home page body
# (/method/, /canvas/) or from nowhere at all (/consulting/) — i.e. invisible to
# the deep-link visitor, who never sees the home page.
methode:
  - title: Methode
    children:
    - title: Die arc42-Methode
      url: /method/
    - title: Canvas
      url: /canvas/
    - title: Template herunterladen
      url: "https://arc42.org/download"
      hint: "arc42.org · englisch"
      external: true
    - title: Consulting
      url: /consulting/

about:
  - title: Über uns
    url: /about/
    children:
    - title: "Kontakt"
      url: /contact/
    - title: Stimmung beim Training...
      url: /gallery/
    - title: "Mitwirkende"
      url: "https://github.com/orgs/arc42/people"
      external: true
    # "Lizenz" removed 2026-08-12 — a legal artifact, not a destination; the
    # footer links /license/ on every page. (Sidebar cost: /license/ no longer
    # lists itself in its own rail.)
    - title: "Geschäftsbedingungen (AGB)"
      url: /terms/
