<!-- start custom head snippets -->

{% if page.botpoison %}
 <!-- 1. Import the @botpoison/browser script -->
 <!-- This is used to spam-protect forms.     -->
 <!-- `defer` keeps a third-party CDN out of the render-blocking path: this
      script sat synchronously in <head> on the registration page, so a slow
      or proxy-blocked unpkg.com stalled the whole checkout. Deferred scripts
      still run before DOMContentLoaded, which is well before anyone can
      submit, so botpoison still attaches in time. -->
<script src="https://unpkg.com/@botpoison/browser" defer></script>
{% endif %}

<script defer data-domain="arc42.de" src="https://plausible.io/js/script.js"></script>

<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">

<!-- Mobile browser chrome wears the masthead hue (meta.arc42.org ADR-0008) -->
<meta name="theme-color" content="#2b3a57">
