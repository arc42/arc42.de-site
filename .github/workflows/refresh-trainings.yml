name: Refresh training dates
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [trainings-updated]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'arc42/arc42.de-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch trainings.json
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/trainings.json \
            https://trainings.arc42.org/api/trainings.json
      - name: Validate payload (a CDN error page arrives as 200 - check content)
        run: |
          jq -e '.courses | length > 0' /tmp/trainings.json
          jq -e '[.courses[].dates[]? | select(.language == null or .start == null or .end == null or .code == null)] | length == 0' /tmp/trainings.json
          jq -e '.generated | type == "string"' /tmp/trainings.json
      - name: Update _data/trainings.json when courses changed
        run: |
          jq -S 'del(.generated)' /tmp/trainings.json > /tmp/new.json
          jq -S 'del(.generated)' _data/trainings.json > /tmp/old.json || echo '{}' > /tmp/old.json
          if cmp -s /tmp/new.json /tmp/old.json; then
            echo "No content change (ignoring 'generated' timestamp)"
            exit 0
          fi
          jq . /tmp/trainings.json > _data/trainings.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/trainings.json
          git commit -m "chore: refresh training dates from trainings.arc42.org"
          git push
